<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✝️ Ježišova Apka</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Georgia', serif;
  min-height: 100vh;
  background-image: url('https://media.base44.com/images/public/69b2746d7a564e31843d7b15/4c72f7d01_generated_image.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}
.overlay {
  min-height: 100vh;
  background: rgba(20,10,5,0.48);
  display: flex;
  flex-direction: column;
  align-items: center;
}
.header {
  text-align: center;
  padding: 32px 20px 12px;
  color: white;
}
.header .cross { font-size: 40px; }
.header h1 { font-size: 26px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,0.6); letter-spacing: 1px; margin: 6px 0 4px; }
.header p { font-size: 13px; opacity: 0.85; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
.tabs {
  display: flex; justify-content: center; gap: 6px;
  padding: 0 12px 14px; flex-wrap: wrap;
}
.tab-btn {
  background: rgba(255,255,255,0.15);
  color: white; border: 2px solid rgba(255,255,255,0.3);
  border-radius: 20px; padding: 7px 13px;
  font-weight: 700; cursor: pointer; font-size: 12px;
  backdrop-filter: blur(8px); font-family: 'Georgia', serif;
  transition: all 0.2s;
}
.tab-btn.active { background: rgba(200,169,110,0.95); border-color: #c8a96e; }
.tab-btn:hover { transform: translateY(-1px); }
.content { flex: 1; padding: 0 14px 40px; max-width: 620px; width: 100%; }

/* Cards */
.verse-card {
  background: rgba(255,255,255,0.93); border-radius: 20px;
  padding: 24px 22px; text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  border: 2px solid #c8a96e; margin-bottom: 12px;
}
.verse-card .vc-cross { font-size: 26px; margin-bottom: 10px; }
.verse-card .vc-text { font-size: 16px; color: #3d2b1f; line-height: 1.8; font-style: italic; margin-bottom: 10px; }
.verse-card .vc-ref { font-size: 13px; color: #c8a96e; font-weight: 700; margin-bottom: 12px; }
.btn-save { background: #c8a96e; color: white; border: none; border-radius: 12px; padding: 7px 20px; font-weight: 700; cursor: pointer; font-size: 13px; font-family: 'Georgia', serif; }

/* Home grid */
.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.grid-card {
  background: rgba(255,255,255,0.15); border: 2px solid rgba(200,169,110,0.5);
  border-radius: 16px; padding: 16px 12px; text-align: center;
  color: white; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.2s;
}
.grid-card:hover { background: rgba(200,169,110,0.3); transform: translateY(-2px); }
.grid-card .gc-emoji { font-size: 24px; margin-bottom: 6px; }
.grid-card .gc-title { font-weight: 800; font-size: 14px; margin-bottom: 3px; }
.grid-card .gc-desc { font-size: 11px; opacity: 0.8; }

/* White box */
.white-box {
  background: rgba(255,255,255,0.93); border-radius: 20px;
  padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  margin-bottom: 12px;
}
.white-box h3 { color: #3d2b1f; margin-bottom: 10px; font-size: 16px; }

/* Inputs */
textarea, select {
  width: 100%; border: 2px solid #e2d5c0; border-radius: 12px;
  padding: 10px 12px; font-family: 'Georgia', serif; font-size: 14px;
  color: #3d2b1f; background: #fdf8f2; outline: none;
}
textarea { resize: none; min-height: 72px; }
textarea:focus, select:focus { border-color: #c8a96e; }
.btn-gold {
  background: #c8a96e; color: white; border: none; border-radius: 12px;
  padding: 11px 20px; font-weight: 700; cursor: pointer; font-size: 14px;
  font-family: 'Georgia', serif; margin-top: 8px; width: 100%; transition: all 0.2s;
}
.btn-gold:hover { background: #b8956a; }
.btn-outline {
  background: rgba(255,255,255,0.12); color: white;
  border: 2px solid rgba(200,169,110,0.7); border-radius: 12px;
  padding: 10px 20px; font-weight: 700; cursor: pointer; font-size: 13px;
  font-family: 'Georgia', serif; margin-top: 8px; width: 100%;
  backdrop-filter: blur(8px); transition: all 0.2s;
}
.btn-outline:hover { background: rgba(200,169,110,0.25); }
.btn-sm {
  background: #c8a96e; color: white; border: none; border-radius: 10px;
  padding: 6px 14px; font-weight: 700; cursor: pointer; font-size: 12px;
  font-family: 'Georgia', serif; transition: all 0.2s;
}
.btn-sm:hover { background: #b8956a; }
.btn-sm.secondary { background: rgba(200,169,110,0.3); border: 1px solid #c8a96e; }

/* Prayer */
.prayer-card {
  background: rgba(255,255,255,0.93); border-radius: 18px; padding: 18px 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12); border: 2px solid #c8a96e;
  margin-bottom: 10px; cursor: pointer; transition: all 0.2s;
}
.prayer-card:hover { transform: translateY(-1px); }
.prayer-card .pc-header { display: flex; justify-content: space-between; align-items: center; }
.prayer-card h3 { color: #3d2b1f; font-size: 15px; }
.prayer-card .pc-arrow { color: #c8a96e; font-size: 14px; }
.prayer-card .pc-text { color: #5a3e2b; font-size: 14px; line-height: 1.8; font-style: italic; margin-top: 12px; display: none; padding-top: 10px; border-top: 1px solid #e2d5c0; }
.prayer-card.open .pc-text { display: block; }
.prayer-audio-btn { background: none; border: none; cursor: pointer; font-size: 18px; margin-left: 8px; }

/* Bible section */
.bible-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.bible-controls select { flex: 1; min-width: 100px; }
.bible-verse-row { padding: 8px 0; border-bottom: 1px solid #e8ddd0; display: flex; gap: 10px; align-items: flex-start; }
.bible-verse-row:last-child { border-bottom: none; }
.bible-verse-num { color: #c8a96e; font-weight: 800; font-size: 12px; min-width: 24px; margin-top: 2px; }
.bible-verse-text { color: #3d2b1f; font-size: 15px; line-height: 1.75; flex: 1; }
.bible-heading { color: #8b6d4a; font-weight: 700; font-size: 13px; margin: 10px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.bible-nav { display: flex; gap: 8px; margin-top: 12px; }
.bible-nav button { flex: 1; }
.bible-search-result { padding: 12px; border-bottom: 1px solid #e8ddd0; cursor: pointer; }
.bible-search-result:hover { background: rgba(200,169,110,0.1); border-radius: 8px; }
.bible-search-result .bsr-ref { color: #c8a96e; font-weight: 700; font-size: 12px; margin-bottom: 4px; }
.bible-search-result .bsr-text { color: #3d2b1f; font-size: 14px; line-height: 1.6; }
.bible-loading { text-align: center; padding: 30px; color: #8b6d4a; }

/* Saved */
.saved-empty { text-align: center; color: white; padding: 40px 20px; opacity: 0.8; }
.saved-item { background: rgba(255,255,255,0.93); border-radius: 14px; padding: 16px; margin-bottom: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); border-left: 4px solid #c8a96e; }
.saved-item .si-text { font-style: italic; color: #3d2b1f; font-size: 14px; line-height: 1.7; margin-bottom: 6px; }
.saved-item .si-ref { color: #c8a96e; font-weight: 700; font-size: 12px; }
.saved-item .si-del { float: right; background: none; border: none; color: #bbb; cursor: pointer; font-size: 15px; }
.saved-item .si-del:hover { color: #e53e3e; }

/* Modlitby kategórie */
.prayer-cat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.prayer-cat-btn {
  background: rgba(255,255,255,0.15); border: 2px solid rgba(200,169,110,0.4);
  border-radius: 14px; padding: 12px 8px; text-align: center;
  color: white; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.2s;
  font-family: 'Georgia', serif; font-size: 12px; font-weight: 700;
}
.prayer-cat-btn:hover, .prayer-cat-btn.active { background: rgba(200,169,110,0.4); border-color: #c8a96e; }
.prayer-cat-btn .pcat-emoji { font-size: 18px; display: block; margin-bottom: 3px; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #c8a96e; color: white; padding: 10px 24px;
  border-radius: 20px; font-weight: 700; font-size: 13px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.25); opacity: 0; pointer-events: none;
  transition: opacity 0.3s; font-family: 'Georgia', serif; z-index: 999;
}
.toast.show { opacity: 1; }

@media(max-width:480px) {
  .header h1 { font-size: 22px; }
  .bible-controls { flex-direction: column; }
}
</style>

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function getDailyVerse() {
  const d = new Date();
  return DAILY_VERSES[(d.getDay() + d.getDate()) % DAILY_VERSES.length];
}
function getAdviceVerse(text) {
  const lower = text.toLowerCase();
  for (const item of ADVICE_VERSES) {
    if (item.keywords.some(k => lower.includes(k))) return item;
  }
  return ADVICE_VERSES[Math.floor(Math.random() * ADVICE_VERSES.length)];
}
function getSaved() { return JSON.parse(localStorage.getItem('jeziskova_saved') || '[]'); }
function saveVerse(text, ref) {
  const saved = getSaved();
  const updated = [...saved.filter(v => v.ref !== ref), { text, ref }];
  localStorage.setItem('jeziskova_saved', JSON.stringify(updated));
  showToast('❤️ Verš uložený!');
}
function removeSaved(ref) {
  localStorage.setItem('jeziskova_saved', JSON.stringify(getSaved().filter(v => v.ref !== ref)));
  renderContent();
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function speak(text) {
  if (!speechSynth) return;
  speechSynth.cancel();
  if (isSpeaking) { isSpeaking = false; renderContent(); return; }
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'sk-SK'; utt.rate = 0.9;
  // Try Slovak voice
  const voices = speechSynth.getVoices();
  const skVoice = voices.find(v => v.lang.startsWith('sk') || v.lang.startsWith('cs'));
  if (skVoice) utt.voice = skVoice;
  utt.onend = () => { isSpeaking = false; renderContent(); };
  isSpeaking = true;
  speechSynth.speak(utt);
  renderContent();
}
function stopSpeak() {
  speechSynth.cancel();
  isSpeaking = false;
  renderContent();
}

// TABS
// ═══════════════════════════════════════
function renderTabs() {
  const tabs = [
    { id: 'home', label: '🏠 Domov' },
    { id: 'ask', label: '🙏 Poraď mi' },
    { id: 'daily', label: '📖 Citát' },
    { id: 'prayer', label: '🕯️ Modlitby' },
    { id: 'bible', label: '📗 Biblia' },
    { id: 'saved', label: '❤️ Uložené' },
  ];
  document.getElementById('tabs').innerHTML = tabs.map(t =>
    `<button class="tab-btn ${currentTab===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
}
function switchTab(id) {
  currentTab = id; openPrayer = null;
  renderTabs(); renderContent();
}
function togglePrayer(key) {
  // Toggle directly in DOM - no full re-render needed
  const allCards = document.querySelectorAll('.prayer-card');
  allCards.forEach(card => {
    const cardKey = card.getAttribute('data-key');
    if (cardKey === key) {
      const isOpen = card.classList.contains('open');
      card.classList.toggle('open', !isOpen);
      const arrow = card.querySelector('.pc-arrow');
      if (arrow) arrow.textContent = isOpen ? '▼' : '▲';
      openPrayer = isOpen ? null : key;
    } else {
      card.classList.remove('open');
      const arrow = card.querySelector('.pc-arrow');
      if (arrow) arrow.textContent = '▼';
    }
  });
}
function setPrayerCat(id) {
  activePrayerCat = id;
  openPrayer = null;
  renderContent();
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function renderContent() {
  const el = document.getElementById('content');
  if (currentTab==='home') renderHome(el);
  else if (currentTab==='ask') renderAsk(el);
  else if (currentTab==='daily') renderDaily(el);
  else if (currentTab==='prayer') renderPrayer(el);
  else if (currentTab==='bible') renderBible(el);
  else if (currentTab==='saved') renderSaved(el);
}

function verseCardHTML(text, ref, showSave=true) {
  const safe = text.replace(/'/g,"\\'");
  const safeRef = ref.replace(/'/g,"\\'");
  return `<div class="verse-card">
    <div class="vc-cross">✝️</div>
    <p class="vc-text">„${text}"</p>
    <p class="vc-ref">${ref}</p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      ${showSave ? `<button class="btn-save" onclick="saveVerse('${safe}','${safeRef}')">❤️ Uložiť</button>` : ''}
      <button class="btn-save" style="background:#8b6d4a" onclick="speak('${safe} — ${safeRef}')">
        ${isSpeaking ? '⏹ Stop' : '🔊 Čítaj'}
      </button>
    </div>
  </div>`;
}

  <p style="color:rgba(255,255,255,0.7);text-align:center;font-size:13px;margin-bottom:12px">Verš na dnešný deň</p>
  ${verseCardHTML(dv.text, dv.ref)}
  <button class="btn-outline" onclick="showRandomVerse()">🎲 Ďalší verš</button>
  <div id="extraVerse" style="margin-top:12px"></div>`;
}
function showRandomVerse() {
  const v = DAILY_VERSES[Math.floor(Math.random()*DAILY_VERSES.length)];
  document.getElementById('extraVerse').innerHTML = verseCardHTML(v.text, v.ref);
}

// ROSARY DIAGRAM

    <img src="https://media.base44.com/images/public/69b2746d7a564e31843d7b15/34c1dfc6e_image.png"

         style="width:100%;border-radius:12px;display:block;margin:0 auto"/>
    <div style="margin-top:10px;background:#fff8e7;border-radius:10px;padding:10px;border:1px solid #f0d080;font-size:12px;color:#7a5c1e;line-height:1.7">
      <b>*Fatimská prosba:</b> „Ó, Ježišu, odpusť nám naše hriechy, zachráň nás od pekelného ohňa a privádzaj do neba všetky duše, najmä tie, ktoré najviac potrebujú tvoje milosrdenstvo."

      📅 <b>Odporúčané dni:</b><br>
      🌹 <b>Radostný</b> — pondelok, sobota &nbsp;|&nbsp; 😔 <b>Bolestný</b> — utorok, piatok<br>
      ✨ <b>Slávnostný</b> — streda, nedeľa &nbsp;|&nbsp; 💛 <b>Svetla</b> — štvrtok
    </div>

}

// PRAYER
function renderPrayer(el) {
  const catHTML = PRAYER_CATEGORIES.map(c =>
    '<button class="prayer-cat-btn ' + (activePrayerCat===c.id?'active':'') + '" onclick="setPrayerCat(\'' + c.id + '\')">' +
    '<span class="pcat-emoji">' + c.emoji + '</span>' + c.title + '</button>'
  ).join('');

  const prayers = PRAYERS[activePrayerCat] || [];
  let prayersHTML = '';
  for (let i = 0; i < prayers.length; i++) {
    const p = prayers[i];
    const isOpen = openPrayer === activePrayerCat + '_' + i;
    if (p.text === '__ROSARY_DIAGRAM__') {
      prayersHTML += '<div style="margin-bottom:12px">' + rosaryDiagramHTML() + '</div>';
      continue;
    }
    const displayText = p.text.replace(/\n/g, '<br>');
    const arrow = isOpen ? '▲' : '▼';
    const speakLabel = isSpeaking ? '⏹ Stop' : '🔊 Čítaj';
    const openClass = isOpen ? 'open' : '';
    prayersHTML += '<div class="prayer-card ' + openClass + '" data-key="' + activePrayerCat + '_' + i + '" onclick="togglePrayer(\'' + activePrayerCat + '_' + i + '\')">' +
      '<div class="pc-header"><h3>' + p.title + '</h3><span class="pc-arrow">' + arrow + '</span></div>' +
      '<div class="pc-text" style="white-space:pre-line">' + displayText +
      '<div style="margin-top:12px;display:flex;gap:8px">' +
      '<button class="btn-sm" onclick="event.stopPropagation();speakText(' + i + ')">' + speakLabel + '</button>' +
      '<button class="btn-sm secondary" onclick="event.stopPropagation();savePrayer(' + i + ')">❤️ Uložiť</button>' +
      '</div></div></div>';
  }

  el.innerHTML = '<div class="prayer-cat-grid">' + catHTML + '</div>' + prayersHTML;
}
function speakText(i) {
  const p = (PRAYERS[activePrayerCat] || [])[i];
  if (!p) return;
  speak(p.text.replace(/\n/g, ' '));
}
function savePrayer(i) {
  const p = (PRAYERS[activePrayerCat] || [])[i];
  if (!p) return;
  saveVerse(p.text.replace(/\n/g, ' '), p.title);
}

// BIBLE
function renderBible(el) {
  const bookOptions = BIBLE_BOOKS.map(b =>
    `<option value="${b.id}" ${bibleBook===b.id?'selected':''}>${b.name}</option>`
  ).join('');

  const chapterOptions = Array.from({length: bibleChapterCount}, (_,i) =>
    `<option value="${i+1}" ${bibleChapter===i+1?'selected':''}>${i+1}. kapitola</option>`
  ).join('');

  el.innerHTML = `
  <div class="white-box">
    <h3>📗 Slovenská Biblia — Nový zákon</h3>
    <p style="font-size:12px;color:#8b6d4a;margin-bottom:12px">„Nádej pre každého" — voľne dostupný preklad</p>
    <div class="bible-controls">
      <select onchange="changeBibleBook(this.value)">${bookOptions}</select>
      <select onchange="changeBibleChapter(parseInt(this.value))">${chapterOptions}</select>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn-sm" onclick="loadBibleChapter()" style="flex:1">📖 Čítať</button>
      <button class="btn-sm secondary" onclick="speakBible()" style="flex:1">${isSpeaking?'⏹ Stop':'🔊 Čítaj nahlas'}</button>
    </div>
    <div id="bibleContent"><div class="bible-loading">Vyber knihu a kapitolu a stlač Čítať 📖</div></div>
    <div class="bible-nav">
      <button class="btn-sm secondary" onclick="prevChapter()">◀ Predchádzajúca</button>
      <button class="btn-sm" onclick="nextChapter()">Nasledujúca ▶</button>
    </div>
  </div>
  <div class="white-box" style="margin-top:0">
    <h3>🔍 Hľadaj verš</h3>
    <input type="text" id="bibleSearchInput" placeholder="Napr: láska, nádej, strach..." 
      style="width:100%;border:2px solid #e2d5c0;border-radius:12px;padding:10px;font-family:Georgia,serif;font-size:14px;color:#3d2b1f;background:#fdf8f2;outline:none;margin-bottom:8px">
    <button class="btn-gold" onclick="searchBible()" style="margin-top:0">🔍 Hľadať</button>
    <div id="bibleSearchResults" style="margin-top:12px"></div>
  </div>`;
}

function changeBibleBook(bookId) {
  bibleBook = bookId;
  const book = BIBLE_BOOKS.find(b => b.id === bookId);
  bibleChapter = 1;
  // Fetch chapter count
  fetch(`https://bible.helloao.org/api/slk_bib/${bookId}/1.json`)
    .then(r => r.json())
    .then(data => {
      bibleChapterCount = data.book?.numberOfChapters || 21;
      renderContent();
    }).catch(() => { bibleChapterCount = 28; renderContent(); });
}

function changeBibleChapter(ch) {
  bibleChapter = ch;
}

async function loadBibleChapter() {
  const key = `${bibleBook}_${bibleChapter}`;
  const el = document.getElementById('bibleContent');
  if (!el) return;
  
  if (bibleCache[key]) {
    renderChapter(el, bibleCache[key]);
    return;
  }
  
  el.innerHTML = '<div class="bible-loading">⏳ Načítavam...</div>';
  try {
    const res = await fetch(`https://bible.helloao.org/api/slk_bib/${bibleBook}/${bibleChapter}.json`);
    const data = await res.json();
    bibleCache[key] = data;
    renderChapter(el, data);
  } catch(e) {
    el.innerHTML = '<div class="bible-loading">❌ Chyba načítania. Skús znovu.</div>';
  }
}

function renderChapter(el, data) {
  const content = data.chapter?.content || [];
  const bookName = BIBLE_BOOKS.find(b => b.id === bibleBook)?.name || bibleBook;
  let html = `<p style="color:#8b6d4a;font-size:13px;font-weight:700;margin-bottom:10px">${bookName} ${bibleChapter}. kapitola</p>`;
  
  for (const item of content) {
    if (item.type === 'heading') {
      html += `<div class="bible-heading">${item.content.join(' ')}</div>`;
    } else if (item.type === 'verse') {
      const text = item.content.map(c => typeof c === 'string' ? c : (c.text || '')).join(' ');
      html += `<div class="bible-verse-row">
        <span class="bible-verse-num">${item.number}</span>
        <span class="bible-verse-text">${text}</span>
      </div>`;
    }
  }
  el.innerHTML = html;
}

function speakBible() {
  if (isSpeaking) { stopSpeak(); return; }
  const key = `${bibleBook}_${bibleChapter}`;
  const data = bibleCache[key];
  if (!data) { showToast('Najprv načítaj kapitolu 📖'); return; }
  const content = data.chapter?.content || [];
  const texts = content
    .filter(i => i.type === 'verse')
    .map(i => `Verš ${i.number}. ${i.content.map(c => typeof c==='string'?c:(c.text||'')).join(' ')}`)
    .join(' ');
  const bookName = BIBLE_BOOKS.find(b => b.id === bibleBook)?.name || '';
  speak(`${bookName}, ${bibleChapter}. kapitola. ${texts}`);
}

function prevChapter() {
  if (bibleChapter > 1) { bibleChapter--; renderContent(); setTimeout(loadBibleChapter, 100); }
}
function nextChapter() {
  if (bibleChapter < bibleChapterCount) { bibleChapter++; renderContent(); setTimeout(loadBibleChapter, 100); }
}

async function searchBible() {
  const query = document.getElementById('bibleSearchInput')?.value?.toLowerCase().trim();
  const resEl = document.getElementById('bibleSearchResults');
  if (!query || !resEl) return;
  
  resEl.innerHTML = '<div class="bible-loading">⏳ Hľadám...</div>';
  
  // Search through a few key chapters
  const searchTargets = [
    {book:'JHN',ch:3},{book:'JHN',ch:14},{book:'JHN',ch:15},
    {book:'ROM',ch:8},{book:'PHP',ch:4},{book:'1CO',ch:13},
    {book:'MAT',ch:5},{book:'MAT',ch:6},{book:'MAT',ch:11},
    {book:'LUK',ch:15},{book:'EPH',ch:2},{book:'HEB',ch:11},
    {book:'REV',ch:21},{book:'1JN',ch:4},{book:'GAL',ch:5},
  ];
  
  let results = [];
  for (const t of searchTargets) {
    const key = `${t.book}_${t.ch}`;
    let data = bibleCache[key];
    if (!data) {
      try {
        const r = await fetch(`https://bible.helloao.org/api/slk_bib/${t.book}/${t.ch}.json`);
        data = await r.json();
        bibleCache[key] = data;
      } catch(e) { continue; }
    }
    const content = data.chapter?.content || [];
    const bookName = BIBLE_BOOKS.find(b => b.id === t.book)?.name || t.book;
    for (const item of content) {
      if (item.type === 'verse') {
        const text = item.content.map(c => typeof c==='string'?c:(c.text||'')).join(' ');
        if (text.toLowerCase().includes(query)) {
          results.push({ ref: `${bookName} ${t.ch}:${item.number}`, text, book: t.book, ch: t.ch });
        }
      }
    }
    if (results.length >= 8) break;
  }
  
  if (!results.length) {
    resEl.innerHTML = '<div class="bible-loading">Nič sa nenašlo. Skús iné slovo.</div>';
    return;
  }
  
  resEl.innerHTML = results.map(r => `
    <div class="bible-search-result" onclick="goToBibleVerse('${r.book}',${r.ch})">
      <div class="bsr-ref">📍 ${r.ref}</div>
      <div class="bsr-text">${r.text}</div>
    </div>`).join('');
}

function goToBibleVerse(book, ch) {
  bibleBook = book; bibleChapter = ch;
  renderContent();
  setTimeout(loadBibleChapter, 100);
}

// SAVED
function renderSaved(el) {
  const saved = getSaved();
  if (!saved.length) {
    el.innerHTML = `<div class="saved-empty"><div style="font-size:40px;margin-bottom:12px">❤️</div><p>Zatiaľ nemáš uložené žiadne verše.<br>Klikni na ❤️ Uložiť pri ľubovoľnom verši.</p></div>`;
    return;
  }
  el.innerHTML = saved.map(v => {
    const safe = v.ref.replace(/'/g,"\\'");
    return `<div class="saved-item">
      <button class="si-del" onclick="removeSaved('${safe}')">✕</button>
      <p class="si-text">„${v.text}"</p>
      <p class="si-ref">— ${v.ref}</p>
    </div>`;
  }).join('');
}

// INIT
renderTabs();
renderContent();
</script>

  <div id="pwa-install-bar" style="display:none; position:fixed; bottom:0; left:0; right:0; background:linear-gradient(135deg,#1a0a2e,#2d1654); border-top:2px solid #c8a96e; padding:12px 20px; z-index:9999; text-align:center;">
    <button onclick="installPWA()" style="background:#c8a96e; color:#1a0a2e; border:none; border-radius:20px; padding:10px 28px; font-size:15px; font-weight:700; cursor:pointer; font-family:Georgia,serif;">
      📱 Nainštalovať na plochu
    </button>
    <button onclick="document.getElementById('pwa-install-bar').style.display='none'" style="background:transparent; color:#c8a96e; border:none; font-size:20px; cursor:pointer; margin-left:10px;">✕</button>
  </div>
  <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwa-install-bar').style.display = 'block';
    });
    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          document.getElementById('pwa-install-bar').style.display = 'none';
        });
      }
    }
    window.addEventListener('appinstalled', () => {
      document.getElementById('pwa-install-bar').style.display = 'none';
    });
  </script>
